<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Resume Builder — SandyHub</title><meta name="description" content="Turn career details into structured, ATS-friendly resume content."><link rel="canonical" href="https://sandeep0181.github.io/SandyHub/tools/ai-resume-builder/"><link rel="stylesheet" href="../tool.css"><meta property="og:title" content="AI Resume Builder — SandyHub"><meta property="og:description" content="Turn career details into structured, ATS-friendly resume content."><meta property="og:url" content="https://sandeep0181.github.io/SandyHub/tools/ai-resume-builder/"><meta name="twitter:card" content="summary"><style>.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}textarea{min-height:140px}pre{white-space:pre-wrap;word-break:break-word}.note{padding:12px;border-radius:10px;background:#f6f8fc}</style></head><body><main class="tool-page"><a href="../../">← Back to SandyHub</a><h1>AI Resume Builder</h1><p>Turn career details into structured, ATS-friendly resume content.</p><div class="note">Local prompt workflow — no API key required. Copy the generated AI-ready prompt into your preferred AI assistant.</div><div class="grid"><label>Career details<textarea id="profile" placeholder="Skills, experience, education, achievements..."></textarea></label><label>Target role<textarea id="role" placeholder="Job title and industry"></textarea></label></div><button id="go">Generate Prompt</button><button id="copy" type="button">Copy Result</button><button id="clear" type="button">Clear</button><p id="status"></p><pre id="out"></pre><script>const $=id=>document.getElementById(id);function val(id){return $(id)?.value.trim()||""}$('go').onclick=()=>{const parts=[];if(val('profile')) parts.push('Career details: '+val('profile'));if(val('role')) parts.push('Target role: '+val('role'));if(!parts.length){$('status').textContent='Add some details first.';return}$('out').textContent='You are an expert assistant. Use the information below to complete the task accurately.\n\nINPUTS\n'+parts.join('\n')+'\n\nINSTRUCTIONS\n- Preserve important facts and context.\n- Be clear, useful, and well structured.\n- State uncertainty instead of inventing facts.\n- Return the requested result in a practical format.';$('status').textContent='Prompt generated.'};$('copy').onclick=async()=>{if($('out').textContent) await navigator.clipboard.writeText($('out').textContent)};$('clear').onclick=()=>{$('profile').value='';$('role').value='';$('out').textContent='';$('status').textContent=''};</script></main></body></html>
