<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Create reusable negative prompt instructions for cleaner AI image and video generation workflows."><link rel="canonical" href="https://sandeep0181.github.io/SandyHub/tools/ai-negative-prompt/"><meta property="og:title" content="AI Negative Prompt Builder — SandyHub"><meta property="og:description" content="Build structured negative prompt text for visual AI workflows."><meta name="twitter:card" content="summary"><title>AI Negative Prompt Builder — SandyHub</title><link rel="stylesheet" href="../tool.css"></head><body><main class="tool-page"><a href="../../">← SandyHub</a><h1>AI Negative Prompt Builder</h1><p>Build a reusable negative-prompt checklist for visual generation.</p><label>What are you generating?<input id="type" placeholder="e.g. Portrait, product, cinematic video"></label><label>Problems to avoid<input id="avoid" placeholder="e.g. blur, extra objects, distorted text"></label><label>Consistency needs<input id="consistency" placeholder="e.g. same character and clothing"></label><button onclick="make()">Generate Prompt</button><button onclick="copyResult()">Copy Result</button><textarea id="out" rows="12" readonly></textarea></main><script>function make(){const g=id=>document.getElementById(id).value.trim();document.getElementById('out').value=`Negative prompt for ${g('type')||'[visual type]'}:\nAvoid: ${g('avoid')||'blur, unwanted artifacts, distorted anatomy, duplicate objects, unreadable text and inconsistent details'}.\nConsistency: ${g('consistency')||'maintain consistent subjects, proportions, lighting and scene details'}.\nKeep the requested composition intact and do not introduce unrelated elements.`}function copyResult(){navigator.clipboard?.writeText(document.getElementById('out').value)}</script><script src="../../ai/client.js"></script><script src="../../ai/tool-ai.js"></script></body></html>
