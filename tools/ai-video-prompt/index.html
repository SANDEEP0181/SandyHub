<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Create structured AI video prompts for scenes, camera movement, action, dialogue and pacing."><link rel="canonical" href="https://sandeep0181.github.io/SandyHub/tools/ai-video-prompt/"><meta property="og:title" content="AI Video Prompt Builder — SandyHub"><meta property="og:description" content="Build structured video-generation prompts locally."><meta name="twitter:card" content="summary"><title>AI Video Prompt Builder — SandyHub</title><link rel="stylesheet" href="../tool.css"></head><body><main class="tool-page"><a href="../../">← SandyHub</a><h1>AI Video Prompt Builder</h1><p>Create structured prompts for AI video workflows.</p><label>Scene<input id="scene" placeholder="e.g. Character walking through a rainy street"></label><label>Camera<input id="camera" placeholder="e.g. slow tracking shot"></label><label>Action<input id="action" placeholder="e.g. looks at neon signs"></label><label>Style<input id="style" placeholder="e.g. cinematic realistic"></label><label>Duration / pacing<input id="pace" placeholder="e.g. 8 seconds, smooth motion"></label><button onclick="make()">Generate Prompt</button><button onclick="copyResult()">Copy Result</button><textarea id="out" rows="12" readonly></textarea></main><script>function make(){const g=id=>document.getElementById(id).value.trim();document.getElementById('out').value=`Generate a video scene: ${g('scene')||'[scene]'}. Camera: ${g('camera')||'[camera movement]'}. Action: ${g('action')||'[action]'}. Visual style: ${g('style')||'cinematic and coherent'}. Duration and pacing: ${g('pace')||'[duration/pacing]'}. Maintain subject consistency, natural motion, coherent lighting and stable backgrounds. Avoid sudden identity, clothing or scene changes unless explicitly requested.`}function copyResult(){navigator.clipboard?.writeText(document.getElementById('out').value)}</script><script src="../../ai/client.js"></script><script src="../../ai/tool-ai.js"></script></body></html>
