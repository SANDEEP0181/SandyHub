<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Build structured prompts for AI models that return clean JSON with a defined schema."><link rel="canonical" href="https://sandeep0181.github.io/SandyHub/tools/ai-json-prompt/"><meta property="og:title" content="AI JSON Prompt Builder — SandyHub"><meta property="og:description" content="Create schema-aware prompts for reliable JSON output."><meta name="twitter:card" content="summary"><title>AI JSON Prompt Builder — SandyHub</title><link rel="stylesheet" href="../tool.css"></head><body><main class="tool-page"><a href="../../">← SandyHub</a><h1>AI JSON Prompt Builder</h1><p>Create a schema-aware prompt for structured AI output.</p><label>Task<input id="task" placeholder="e.g. Extract product information"></label><label>Fields<textarea id="fields" rows="6" placeholder="name:string, price:number, category:string"></textarea></label><label>Rules<textarea id="rules" rows="5" placeholder="No markdown. Use null when unknown."></textarea></label><button onclick="make()">Generate Prompt</button><button onclick="copyResult()">Copy Result</button><textarea id="out" rows="14" readonly></textarea></main><script>function make(){const g=id=>document.getElementById(id).value.trim();document.getElementById('out').value=`Return valid JSON only. Task: ${g('task')||'[task]'}\n\nSchema / fields:\n${g('fields')||'[fields]'}\n\nRules:\n${g('rules')||'Use the requested types, do not add unrequested fields, and use null when information is unavailable.'}\n\nValidate the JSON structure before returning it. Do not wrap the response in Markdown code fences.`}function copyResult(){navigator.clipboard?.writeText(document.getElementById('out').value)}</script><script src="../../ai/client.js"></script><script src="../../ai/tool-ai.js"></script></body></html>
