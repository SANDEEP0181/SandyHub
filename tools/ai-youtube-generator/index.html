<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Create AI-ready prompts for YouTube titles, descriptions, hooks and video ideas."><link rel="canonical" href="https://sandeep0181.github.io/SandyHub/tools/ai-youtube-generator/"><meta property="og:title" content="AI YouTube Generator — SandyHub"><meta property="og:description" content="Build structured YouTube content prompts locally."><meta name="twitter:card" content="summary"><title>AI YouTube Generator — SandyHub</title><link rel="stylesheet" href="../tool.css"></head><body><main class="tool-page"><a href="../../">← SandyHub</a><h1>AI YouTube Generator</h1><p>Create a structured prompt for YouTube titles, descriptions, hooks and content ideas.</p><label>Video topic<input id="topic" placeholder="e.g. Beginner AI tools"></label><label>Audience<input id="audience" placeholder="e.g. Hindi-speaking creators"></label><label>Video goal<input id="goal" placeholder="e.g. Education and discovery"></label><label>Style<input id="style" placeholder="e.g. Fast, practical and engaging"></label><button onclick="make()">Generate Prompt</button><button onclick="copyResult()">Copy Result</button><textarea id="out" rows="14" readonly></textarea></main><script>function make(){const g=id=>document.getElementById(id).value.trim();document.getElementById('out').value=`You are an expert YouTube content strategist.\n\nTopic: ${g('topic')||'[topic]'}\nAudience: ${g('audience')||'[audience]'}\nGoal: ${g('goal')||'[goal]'}\nStyle: ${g('style')||'clear, engaging and useful'}\n\nCreate:\n1. 10 original video title ideas\n2. 3 strong opening hooks\n3. A concise SEO-aware description\n4. A short chapter outline\n5. Relevant keyword ideas\n\nKeep claims accurate, avoid clickbait that misrepresents the video, and make the output easy to copy.`}function copyResult(){navigator.clipboard?.writeText(document.getElementById('out').value)}</script><script src="../../ai/client.js"></script><script src="../../ai/tool-ai.js"></script></body></html>
