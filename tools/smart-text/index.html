<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free local text assistant for formatting, case conversion, word counts and quick text cleanup."><title>Smart Text Assistant — SandyHub</title><link rel="stylesheet" href="../tool.css"></head><body data-tool="smart-text"><main class="wrap"><a class="back" href="../../">← Back to SandyHub</a><section class="card"><h1>Smart Text Assistant</h1><p class="desc">Fast browser-based text utilities. Your text stays in your browser.</p><select id="mode"><option value="cleanup">Clean extra spaces</option><option value="uppercase">UPPERCASE</option><option value="lowercase">lowercase</option><option value="title">Title Case</option><option value="count">Count words & characters</option><option value="bullets">Convert lines to bullets</option></select><textarea id="input" placeholder="Enter or paste text here..."></textarea><div class="row"><button id="run">Run Tool</button><button id="clear" class="secondary">Clear</button></div><pre id="output">Your result will appear here.</pre><p class="note">This is a local utility; it does not call an AI service.</p></section></main><script src="../tool.js"></script></body></html>
