<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Generate SEO title, description, canonical and Open Graph meta tags for a webpage."><link rel="canonical" href="https://sandeep0181.github.io/SandyHub/tools/meta-tag-generator/"><meta property="og:title" content="Meta Tag Generator — SandyHub"><meta property="og:description" content="Generate useful SEO meta tags locally."><meta property="og:type" content="website"><meta name="twitter:card" content="summary"><title>Meta Tag Generator — SandyHub</title><link rel="stylesheet" href="../tool.css"></head><body><main class="wrap"><a class="back" href="../../">← Back to SandyHub</a><section class="card"><h1>Meta Tag Generator</h1><p class="desc">Create ready-to-paste SEO and social meta tags.</p><input id="title" placeholder="Page title"><input id="desc" placeholder="Meta description"><input id="url" placeholder="Canonical URL"><input id="image" placeholder="Social image URL (optional)"><div class="row"><button id="run">Generate Tags</button><button class="secondary" id="clear">Clear</button></div><textarea id="out" readonly></textarea><button class="copy-btn" id="copy">Copy Result</button></section></main><script>const e=id=>document.getElementById(id),esc=s=>s.replaceAll('&','&amp;').replaceAll('&quot;','&amp;quot;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;');e('run').onclick=()=>{let t=esc(e('title').value.trim()),d=esc(e('desc').value.trim()),u=esc(e('url').value.trim()),im=esc(e('image').value.trim());e('out').value='<meta name="description" content="'+d+'">\n<link rel="canonical" href="'+u+'">\n<meta property="og:title" content="'+t+'">\n<meta property="og:description" content="'+d+'">\n<meta property="og:url" content="'+u+'">\n<meta property="og:type" content="website">\n<meta name="twitter:card" content="summary_large_image">\n<meta name="twitter:title" content="'+t+'">\n<meta name="twitter:description" content="'+d+'">'+(im?'\n<meta property="og:image" content="'+im+'">\n<meta name="twitter:image" content="'+im+'">':'')};e('clear').onclick=()=>document.querySelectorAll('input,textarea').forEach(x=>x.value='');e('copy').onclick=()=>navigator.clipboard.writeText(e('out').value)</script></body></html>
