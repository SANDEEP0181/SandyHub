<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Convert CSV data into JSON directly in your browser with SandyHub's free CSV to JSON Converter."><meta name="theme-color" content="#111827"><link rel="canonical" href="https://sandeep0181.github.io/SandyHub/tools/csv-to-json/"><meta property="og:type" content="website"><meta property="og:site_name" content="SandyHub"><meta property="og:title" content="CSV to JSON Converter — Free Online Tool | SandyHub"><meta property="og:description" content="Convert CSV data into JSON directly in your browser with SandyHub's free CSV to JSON Converter."><meta property="og:url" content="https://sandeep0181.github.io/SandyHub/tools/csv-to-json/"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="CSV to JSON Converter — Free Online Tool | SandyHub"><meta name="twitter:description" content="Convert CSV data into JSON directly in your browser with SandyHub's free CSV to JSON Converter."><title>CSV to JSON Converter — Free Online Tool | SandyHub</title><link rel="stylesheet" href="../tool.css"></head><body><main class="wrap"><a class="back" href="../../">← Back to SandyHub</a><section class="card"><h1>CSV to JSON Converter</h1><p class="desc">Convert CSV data into JSON directly in your browser with SandyHub's free CSV to JSON Converter.</p><textarea id="input" placeholder="name,age,city\nSandy,43,Indore"></textarea><div class="row"><button id="run">Convert</button><button id="clear" class="secondary">Clear</button></div><pre id="output">Your JSON will appear here.</pre><p class="note">Processing is done locally in your browser.</p></section></main><script>const input=document.getElementById("input"),output=document.getElementById("output"),run=document.getElementById("run"),clearBtn=document.getElementById("clear");run.onclick=()=>{try{const rows=input.value.trim().split(/\r?\n/).filter(Boolean).map(r=>r.split(","));if(rows.length<2)throw Error("Add a header row and at least one data row.");const h=rows[0].map(x=>x.trim());const data=rows.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]??"").trim()])));output.textContent=JSON.stringify(data,null,2)}catch(e){output.textContent="Error: "+e.message}};clearBtn.onclick=()=>{if(input)input.value="";if(output)output.textContent="Your result will appear here.";if(document.getElementById("pattern"))document.getElementById("pattern").value=""}</script></body></html>
