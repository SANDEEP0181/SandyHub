<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Build structured AI prompts for SQL query writing, debugging and optimization."><link rel="canonical" href="https://sandeep0181.github.io/SandyHub/tools/ai-sql-helper/"><meta property="og:title" content="AI SQL Helper — SandyHub"><meta property="og:description" content="Prepare prompts for SQL generation, debugging and optimization."><meta name="twitter:card" content="summary"><title>AI SQL Helper — SandyHub</title><link rel="stylesheet" href="../tool.css"></head><body><main class="tool-page"><a href="../../">← SandyHub</a><h1>AI SQL Helper</h1><p>Create an AI-ready SQL task prompt locally.</p><label>Database<input id="db" placeholder="e.g. PostgreSQL"></label><label>Task<input id="task" placeholder="e.g. Find monthly active users"></label><label>Schema<textarea id="schema" rows="7" placeholder="Tables, columns and relationships..."></textarea></label><label>Existing query (optional)<textarea id="query" rows="6"></textarea></label><button onclick="make()">Generate Prompt</button><button onclick="copyResult()">Copy Result</button><textarea id="out" rows="14" readonly></textarea></main><script>function make(){const g=id=>document.getElementById(id).value.trim();document.getElementById('out').value=`Act as an expert SQL developer. Database: ${g('db')||'[database]'}.\n\nTask: ${g('task')||'[task]'}\n\nSchema:\n${g('schema')||'[schema]'}\n\nExisting query:\n${g('query')||'[none]'}\n\nReturn a correct, readable SQL query, explain assumptions, flag ambiguous schema details, and suggest indexes or performance improvements only when justified. Never invent table or column names without clearly marking assumptions.`}function copyResult(){navigator.clipboard?.writeText(document.getElementById('out').value)}</script></body></html>
