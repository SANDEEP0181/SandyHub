<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Create an AI-ready content brief with topic, audience, keywords, sections and call to action."><link rel="canonical" href="https://sandeep0181.github.io/SandyHub/tools/ai-content-brief/"><meta property="og:title" content="AI Content Brief Generator — SandyHub"><meta property="og:description" content="Create structured content briefs for AI workflows."><meta property="og:type" content="website"><title>AI Content Brief Generator — SandyHub</title><link rel="stylesheet" href="../tool.css"></head><body><main class="wrap"><a class="back" href="../../">← Back to SandyHub</a><section class="card"><h1>AI Content Brief Generator</h1><p class="desc">Turn a topic into a structured brief ready to give to an AI assistant.</p><input id="topic" placeholder="Topic"><input id="aud" placeholder="Target audience"><input id="kw" placeholder="Keywords, comma separated"><input id="goal" placeholder="Content goal"><div class="row"><button id="g">Create Brief</button></div><textarea id="o" readonly></textarea><button class="copy-btn" id="c">Copy Result</button></section></main><script>const e=id=>document.getElementById(id);e('g').onclick=()=>e('o').value='# AI CONTENT BRIEF\n\nTopic: '+e('topic').value+'\nAudience: '+e('aud').value+'\nGoal: '+e('goal').value+'\nKeywords: '+e('kw').value+'\n\n## Suggested Structure\n1. Introduction and search intent\n2. Key concepts and practical details\n3. Examples or use cases\n4. Common mistakes / FAQs\n5. Clear conclusion and next step\n\n## AI Instructions\nWrite accurately, avoid unsupported claims, use the keywords naturally, and keep the structure easy to scan.';e('c').onclick=()=>navigator.clipboard.writeText(e('o').value)</script><script src="../../ai/client.js"></script><script src="../../ai/tool-ai.js"></script></body></html>
