<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Build a reusable AI system prompt with role, rules, goals and response style."><link rel="canonical" href="https://sandeep0181.github.io/SandyHub/tools/ai-system-prompt-builder/"><meta property="og:title" content="AI System Prompt Builder — SandyHub"><meta property="og:description" content="Build reusable system prompts locally."><meta property="og:type" content="website"><title>AI System Prompt Builder — SandyHub</title><link rel="stylesheet" href="../tool.css"></head><body><main class="wrap"><a class="back" href="../../">← Back to SandyHub</a><section class="card"><h1>AI System Prompt Builder</h1><p class="desc">Define an AI assistant's role, goals, rules and response style.</p><input id="r" placeholder="Assistant role"><textarea id="g" placeholder="Goals / responsibilities"></textarea><textarea id="rules" placeholder="Rules or constraints"></textarea><input id="style" placeholder="Response style"><div class="row"><button id="b">Build System Prompt</button></div><textarea id="o" readonly></textarea><button class="copy-btn" id="c">Copy Result</button></section></main><script>const e=id=>document.getElementById(id);e('b').onclick=()=>e('o').value='SYSTEM ROLE\n'+e('r').value+'\n\nGOALS\n'+e('g').value+'\n\nRULES\n'+e('rules').value+'\n\nRESPONSE STYLE\n'+e('style').value;e('c').onclick=()=>navigator.clipboard.writeText(e('o').value)</script><script src="../../ai/client.js"></script><script src="../../ai/tool-ai.js"></script></body></html>
