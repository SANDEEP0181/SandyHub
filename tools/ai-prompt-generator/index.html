<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Create structured AI prompts for writing, coding, images, research and automation."><link rel="canonical" href="https://sandeep0181.github.io/SandyHub/tools/ai-prompt-generator/"><meta property="og:title" content="AI Prompt Generator — SandyHub"><meta property="og:description" content="Build structured prompts for modern AI tools."><meta property="og:type" content="website"><title>AI Prompt Generator — SandyHub</title><link rel="stylesheet" href="../tool.css"></head><body><main class="wrap"><a class="back" href="../../">← Back to SandyHub</a><section class="card"><h1>AI Prompt Generator</h1><p class="desc">Create a structured prompt from your goal, audience, tone and output format.</p><input id="goal" placeholder="What do you want AI to do?"><input id="aud" placeholder="Audience (optional)"><input id="tone" placeholder="Tone, e.g. professional, friendly"><input id="fmt" placeholder="Output format, e.g. bullets, table, JSON"><div class="row"><button id="g">Generate Prompt</button><button class="secondary" id="x">Clear</button></div><textarea id="o" readonly></textarea><button class="copy-btn" id="c">Copy Result</button><p class="note">Prompt generation runs locally. No AI API key is required.</p></section></main><script>const e=id=>document.getElementById(id);e('g').onclick=()=>{let g=e('goal').value.trim(),a=e('aud').value.trim(),t=e('tone').value.trim(),f=e('fmt').value.trim();e('o').value='You are an expert assistant.\n\nTask:\n'+g+'\n\nAudience:\n'+(a||'Use the appropriate audience for this task.')+'\n\nTone:\n'+(t||'Clear, accurate and helpful.')+'\n\nRequirements:\n- Follow the task precisely.\n- State assumptions when needed.\n- Avoid unnecessary filler.\n\nOutput format:\n'+(f||'Use a clear, well-structured format.')};e('x').onclick=()=>document.querySelectorAll('input,textarea').forEach(v=>v.value='');e('c').onclick=()=>navigator.clipboard.writeText(e('o').value)</script></body></html>
