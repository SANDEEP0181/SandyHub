<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Format rough AI instructions into a clean prompt with role, task, context and output sections."><link rel="canonical" href="https://sandeep0181.github.io/SandyHub/tools/ai-prompt-formatter/"><meta property="og:title" content="AI Prompt Formatter — SandyHub"><meta property="og:description" content="Organize rough AI instructions into a clean prompt."><meta property="og:type" content="website"><title>AI Prompt Formatter — SandyHub</title><link rel="stylesheet" href="../tool.css"></head><body><main class="wrap"><a class="back" href="../../">← Back to SandyHub</a><section class="card"><h1>AI Prompt Formatter</h1><p class="desc">Turn a rough instruction into a cleaner reusable prompt template.</p><textarea id="i" placeholder="Paste your rough AI instruction..."></textarea><div class="row"><button id="g">Format Prompt</button></div><textarea id="o" readonly></textarea><button class="copy-btn" id="c">Copy Result</button><p class="note">This is a local prompt-structuring utility, not an AI model.</p></section></main><script>const e=id=>document.getElementById(id);e('g').onclick=()=>{let x=e('i').value.trim();e('o').value='ROLE\nAct as a capable assistant for the task below.\n\nTASK\n'+x+'\n\nCONTEXT\nUse only the information provided by the user and clearly identify assumptions.\n\nOUTPUT\nGive a direct, structured and useful response.\n\nQUALITY CHECK\nVerify the response for clarity, relevance and unsupported claims before answering.'};e('c').onclick=()=>navigator.clipboard.writeText(e('o').value)</script></body></html>
