<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Generate Open Graph and Twitter card tags for sharing webpages on social platforms."><link rel="canonical" href="https://sandeep0181.github.io/SandyHub/tools/og-tag-generator/"><meta property="og:title" content="Open Graph Tag Generator — SandyHub"><meta property="og:description" content="Generate social sharing tags locally."><meta property="og:type" content="website"><meta name="twitter:card" content="summary"><title>Open Graph Tag Generator — SandyHub</title><link rel="stylesheet" href="../tool.css"></head><body><main class="wrap"><a class="back" href="../../">← Back to SandyHub</a><section class="card"><h1>Open Graph Tag Generator</h1><p class="desc">Generate social preview tags for title, description, URL and image.</p><input id="t" placeholder="Title"><input id="d" placeholder="Description"><input id="u" placeholder="URL"><input id="i" placeholder="Image URL"><div class="row"><button id="g">Generate</button></div><textarea id="o" readonly></textarea><button class="copy-btn" id="c">Copy Result</button></section></main><script>const q=x=>document.getElementById(x),z=s=>s.replaceAll('"','&quot;');q('g').onclick=()=>{let t=z(q('t').value),d=z(q('d').value),u=z(q('u').value),i=z(q('i').value);q('o').value='<meta property="og:title" content="'+t+'">\n<meta property="og:description" content="'+d+'">\n<meta property="og:url" content="'+u+'">\n<meta property="og:type" content="website">\n<meta property="og:image" content="'+i+'">\n<meta name="twitter:card" content="summary_large_image">\n<meta name="twitter:title" content="'+t+'">\n<meta name="twitter:description" content="'+d+'">\n<meta name="twitter:image" content="'+i+'">'};q('c').onclick=()=>navigator.clipboard.writeText(q('o').value)</script></body></html>
