<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Generate structured AI prompts for social media captions, hooks, hashtags and post variations."><link rel="canonical" href="https://sandeep0181.github.io/SandyHub/tools/ai-social-caption/"><meta property="og:title" content="AI Social Caption Generator — SandyHub"><meta property="og:description" content="Build social caption prompts for AI workflows."><meta name="twitter:card" content="summary"><title>AI Social Caption Generator — SandyHub</title><link rel="stylesheet" href="../tool.css"></head><body><main class="tool-page"><a href="../../">← SandyHub</a><h1>AI Social Caption Generator</h1><p>Turn your post idea into a reusable prompt for captions and social variations.</p><label>Post idea<textarea id="idea" rows="4" placeholder="What is the post about?"></textarea></label><label>Platform<input id="platform" placeholder="e.g. Instagram"></label><label>Audience<input id="audience" placeholder="e.g. New creators"></label><label>Tone<input id="tone" placeholder="e.g. Friendly and confident"></label><button onclick="make()">Generate Prompt</button><button onclick="copyResult()">Copy Result</button><textarea id="out" rows="14" readonly></textarea></main><script>function make(){const g=id=>document.getElementById(id).value.trim();document.getElementById('out').value=`Act as a social media copywriter.\n\nPlatform: ${g('platform')||'[platform]'}\nAudience: ${g('audience')||'[audience]'}\nTone: ${g('tone')||'natural and engaging'}\nPost idea: ${g('idea')||'[idea]'}\n\nCreate 5 caption variations with different hooks. Include a concise call to action and a small set of relevant hashtags. Keep the wording natural, avoid spammy claims, and do not invent facts.`}function copyResult(){navigator.clipboard?.writeText(document.getElementById('out').value)}</script><script src="../../ai/client.js"></script><script src="../../ai/tool-ai.js"></script></body></html>
