mentById("clear");function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}function md(s){let x=esc(s);x=x.replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h1>$1</h1>").replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>").replace(/\*(.*?)\*/g,"<em>$1</em>").replace(/\[(.*?)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\n/g,"<br>");return x}run.onclick=()=>output.innerHTML=input.value?md(input.value):"Your preview will appear here.";clearBtn.onclick=()=>{if(input)input.value="";if(output)output.textContent="Your result will appear here.";if(document.getElementById("pattern"))document.getElementById("pattern").value=""}</script></body></html>
