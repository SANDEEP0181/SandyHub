<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Compress JPEG and WebP images in your browser by choosing quality and download the result."><link rel="canonical" href="https://sandeep0181.github.io/SandyHub/tools/image-compressor/"><meta property="og:title" content="Image Compressor — SandyHub"><meta property="og:description" content="Compress images locally in your browser."><meta property="og:type" content="website"><meta name="twitter:card" content="summary"><title>Image Compressor — SandyHub</title><link rel="stylesheet" href="../tool.css"></head><body><main class="wrap"><a class="back" href="../../">← Back to SandyHub</a><section class="card"><h1>Image Compressor</h1><p class="desc">Compress an image locally by adjusting output quality.</p><input id="file" type="file" accept="image/jpeg,image/png,image/webp"><label>Quality: <input id="q" type="range" min="0.1" max="1" step="0.05" value="0.75"></label><div class="row"><button id="go">Compress & Download</button></div><p id="status" class="note"></p></section></main><script>document.getElementById('go').onclick=()=>{let f=document.getElementById('file').files[0];if(!f){document.getElementById('status').textContent='Select an image first.';return}let im=new Image();im.onload=()=>{let c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);c.toBlob(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sandyhub-compressed.jpg';a.click();document.getElementById('status').textContent='Compressed file downloaded.'},'image/jpeg',+document.getElementById('q').value)};im.src=URL.createObjectURL(f)}</script></body></html>
