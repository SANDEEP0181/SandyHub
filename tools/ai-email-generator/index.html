<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Generate structured AI-ready email prompts for professional, friendly and business messages."><link rel="canonical" href="https://sandeep0181.github.io/SandyHub/tools/ai-email-generator/"><meta property="og:title" content="AI Email Generator — SandyHub"><meta property="og:description" content="Create a structured prompt for generating clear emails with AI."><meta name="twitter:card" content="summary"><title>AI Email Generator — SandyHub</title><link rel="stylesheet" href="../tool.css"></head><body><main class="tool-page"><a href="../../">← SandyHub</a><h1>AI Email Generator</h1><p>Build an AI-ready email prompt from a few details. Runs locally in your browser.</p><label>Purpose<input id="purpose" placeholder="e.g. Request a project update"></label><label>Recipient / audience<input id="audience" placeholder="e.g. Client"></label><label>Tone<input id="tone" placeholder="e.g. Professional and friendly"></label><label>Key points<textarea id="points" rows="5" placeholder="Add the important points..."></textarea></label><button onclick="make()">Generate Prompt</button><button onclick="copyResult()">Copy Result</button><textarea id="out" rows="12" readonly></textarea></main><script>function make(){const g=id=>document.getElementById(id).value.trim();document.getElementById('out').value=[`Role: You are an expert email writer.`,`Task: Write an email for this purpose: ${g('purpose')||'[purpose]'}.`,`Audience: ${g('audience')||'[recipient/audience]'}.`,`Tone: ${g('tone')||'professional, clear and natural'}.`,`Key points:\n${g('points')||'[key points]'}`,`Requirements: Use a clear subject line, concise paragraphs, appropriate greeting and closing. Do not invent facts.`].join('\n\n')}function copyResult(){navigator.clipboard?.writeText(document.getElementById('out').value)}</script></body></html>
