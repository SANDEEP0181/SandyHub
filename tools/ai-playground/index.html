<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Playground — SandyHub</title>
<meta name="description" content="SandyHub AI Playground — a secure API-ready workspace for future real AI generation.">
<link rel="canonical" href="https://sandeep0181.github.io/SandyHub/tools/ai-playground/">
<link rel="stylesheet" href="../tool.css">
<meta property="og:title" content="AI Playground — SandyHub">
<meta property="og:description" content="Secure API-ready AI workspace from SandyHub.">
<meta property="og:url" content="https://sandeep0181.github.io/SandyHub/tools/ai-playground/">
<meta name="twitter:card" content="summary">
<style>
textarea{min-height:170px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.row{grid-template-columns:1fr}}
.notice{padding:12px;border-radius:10px;background:#f6f8fc;margin:12px 0;font-size:.92rem}
pre{white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<main class="tool-page">
<a href="../../">← Back to SandyHub</a>
<h1>AI Playground</h1>
<p>API-ready workspace for real AI generation without exposing provider secrets in the browser.</p>
<div class="notice"><strong>Secure mode:</strong> this page sends requests only to your configured server-side AI endpoint. No provider API key is stored here.</div>
<div class="row">
<label>System instruction<textarea id="system" placeholder="You are a helpful AI assistant."></textarea></label>
<label>User prompt<textarea id="prompt" placeholder="Ask the AI something..."></textarea></label>
</div>
<div class="row">
<label>Endpoint<input id="endpoint" value="../api/ai" placeholder="/api/ai"></label>
<label>Model<input id="model" placeholder="Optional model name"></label>
</div>
<button id="run">Generate</button>
<button id="copy" type="button">Copy Result</button>
<button id="clear" type="button">Clear</button>
<p id="status"></p>
<pre id="result"></pre>
</main>
<script>
const $=id=>document.getElementById(id);
$('run').onclick=async()=>{
 const endpoint=$('endpoint').value.trim(), prompt=$('prompt').value.trim();
 if(!prompt){$('status').textContent='Enter a prompt first.';return}
 $('status').textContent='Sending request…'; $('result').textContent='';
 try{
  const body={messages:[{role:'system',content:$('system').value.trim()},{role:'user',content:prompt}]};
  if($('model').value.trim()) body.model=$('model').value.trim();
  const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const data=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||('Request failed ('+res.status+')'));
  $('result').textContent=typeof data==='string'?data:(data.output||data.content||data.response||JSON.stringify(data,null,2));
  $('status').textContent='Done.';
 }catch(e){$('status').textContent='AI endpoint is not connected yet: '+e.message}
};
$('copy').onclick=async()=>{if($('result').textContent) await navigator.clipboard.writeText($('result').textContent);};
$('clear').onclick=()=>{$('prompt').value='';$('result').textContent='';$('status').textContent='';};
</script>
</body></html>
