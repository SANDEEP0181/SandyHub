<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Text Rewriter — SandyHub</title><meta name="description" content="Rewrite text for professional, friendly, simple, formal, or concise communication."><link rel="canonical" href="https://sandeep0181.github.io/SandyHub/tools/ai-text-rewriter/"><link rel="stylesheet" href="../tool.css"><meta property="og:title" content="AI Text Rewriter — SandyHub"><meta property="og:description" content="Rewrite text for professional, friendly, simple, formal, or concise communication."><meta property="og:url" content="https://sandeep0181.github.io/SandyHub/tools/ai-text-rewriter/"><meta name="twitter:card" content="summary"><style>.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}textarea{min-height:140px}pre{white-space:pre-wrap;word-break:break-word}.note{padding:12px;border-radius:10px;background:#f6f8fc}</style></head><body><main class="tool-page"><a href="../../">← Back to SandyHub</a><h1>AI Text Rewriter</h1><p>Rewrite text for professional, friendly, simple, formal, or concise communication.</p><div class="note">Local prompt workflow — no API key required. Copy the generated AI-ready prompt into your preferred AI assistant.</div><div class="grid"><label>Text to rewrite<textarea id="text" placeholder="Paste your text here..."></textarea></label><label>Desired style<textarea id="style" placeholder="professional, friendly, simple, formal..."></textarea></label></div><button id="go">Generate Prompt</button><button id="ai" type="button">Generate with SandyHub AI</button><button id="copy" type="button">Copy Result</button><button id="clear" type="button">Clear</button><p id="status"></p><pre id="out"></pre><script src="../../ai/client.js"></script><script>const $=id=>document.getElementById(id);function val(id){return $(id)?.value.trim()||""}$('go').onclick=()=>{const parts=[];if(val('text')) parts.push('Text to rewrite: '+val('text'));if(val('style')) parts.push('Desired style: '+val('style'));if(!parts.length){$('status').textContent='Add some details first.';return}$('out').textContent='You are an expert assistant. Use the information below to complete the task accurately.\n\nINPUTS\n'+parts.join('\n')+'\n\nINSTRUCTIONS\n- Preserve important facts and context.\n- Be clear, useful, and well structured.\n- State uncertainty instead of inventing facts.\n- Return the requested result in a practical format.';$('status').textContent='Prompt generated.'};$('ai').onclick=async()=>{const prompt=$('out').textContent;if(!prompt){$('status').textContent='Generate the prompt first.';return}$('status').textContent='Generating with AI…';try{$('out').textContent=await SandyAI.generate([{role:'user',content:prompt}]);$('status').textContent='AI response ready.'}catch(e){$('status').textContent='AI backend is not connected yet: '+e.message}};$('copy').onclick=async()=>{if($('out').textContent) await navigator.clipboard.writeText($('out').textContent)};$('clear').onclick=()=>{$('text').value='';$('style').value='';$('out').textContent='';$('status').textContent=''};</script></main><script src="../../ai/client.js"></script><script src="../../ai/tool-ai.js"></script></body></html>
