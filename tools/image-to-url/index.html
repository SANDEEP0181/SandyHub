<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Upload an image and get a short public URL with SandyHub Image to URL tool.">
<link rel="stylesheet" href="../../style.css"><link rel="stylesheet" href="../tool.css">
<title>Image to URL — SandyHub</title>
</head>
<body data-tool="image-to-url">
<div class="wrap">
<a class="back" href="../../">← Back to SandyHub</a>
<div class="card">
<h1>Image to URL</h1>
<p class="desc">Select an image and upload it to Cloudinary to generate a short shareable URL.</p>
<input id="file" type="file" accept="image/*">
<div class="row"><button id="run" type="button">Generate URL</button><button id="clear" class="secondary" type="button">Clear</button></div>
<p class="note">Maximum image size: 10 MB. The generated URL is a normal public web link and can be shared directly.</p>
<div id="urlWrap" class="url-wrap"><label for="output">Generated Image URL</label><textarea id="output" readonly placeholder="Your generated image URL will appear here."></textarea></div>
<div id="preview"></div>
</div>
</div>
<script>
const CLOUD_NAME='qolxuqm5';
const UPLOAD_PRESET='sandyhub_images';
const imageFile=document.getElementById('file');
const generateBtn=document.getElementById('run');
const clearBtn=document.getElementById('clear');
const result=document.getElementById('output');
const preview=document.getElementById('preview');

generateBtn.onclick=async()=>{
  const file=imageFile.files[0];
  if(!file){ result.value='Error: Select an image first.'; return; }
  if(!file.type.startsWith('image/')){ result.value='Error: Please select an image file.'; return; }
  if(file.size>10*1024*1024){ result.value='Error: Image must be 10 MB or smaller.'; return; }

  generateBtn.disabled=true;
  generateBtn.textContent='Uploading...';
  result.value='Uploading image...';
  preview.innerHTML='';

  try{
    const form=new FormData();
    form.append('file',file);
    form.append('upload_preset',UPLOAD_PRESET);
    const response=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,{
      method:'POST',
      body:form
    });
    const data=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(data.error?.message||'Upload failed.');
    if(!data.secure_url) throw new Error('No image URL was returned.');

    result.value=data.secure_url;
    const img=document.createElement('img');
    img.src=data.secure_url;
    img.alt='Uploaded image preview';
    img.style.maxWidth='100%';
    img.style.maxHeight='320px';
    img.style.marginTop='14px';
    img.style.borderRadius='12px';
    preview.appendChild(img);
  }catch(error){
    result.value='Error: '+(error.message||'Upload failed.');
  }finally{
    generateBtn.disabled=false;
    generateBtn.textContent='Generate URL';
  }
};

clearBtn.onclick=()=>{
  imageFile.value='';
  result.value='';
  preview.innerHTML='';
};
</script>
</body>
</html>
