<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Design multi-step AI workflows by turning a goal into reusable prompt stages and outputs."><link rel="canonical" href="https://sandeep0181.github.io/SandyHub/tools/ai-workflow-builder/"><meta property="og:title" content="AI Workflow Builder — SandyHub"><meta property="og:description" content="Plan reusable multi-step AI workflows locally."><meta name="twitter:card" content="summary"><title>AI Workflow Builder — SandyHub</title><link rel="stylesheet" href="../tool.css"></head><body><main class="tool-page"><a href="../../">← SandyHub</a><h1>AI Workflow Builder</h1><p>Turn a goal into a clear multi-step AI workflow.</p><label>Goal<input id="goal" placeholder="e.g. Create a YouTube video package"></label><label>Input data<textarea id="input" rows="5" placeholder="What information will the workflow receive?"></textarea></label><label>Constraints<textarea id="rules" rows="5" placeholder="Brand voice, length, format, accuracy..."></textarea></label><button onclick="make()">Generate Workflow</button><button onclick="copyResult()">Copy Result</button><textarea id="out" rows="16" readonly></textarea></main><script>function make(){const g=id=>document.getElementById(id).value.trim();document.getElementById('out').value=`Design a reusable AI workflow for this goal: ${g('goal')||'[goal]'}\n\nInput data:\n${g('input')||'[input]'}\n\nConstraints:\n${g('rules')||'[constraints]'}\n\nCreate 4 stages:\n1. Analyze and normalize the input.\n2. Produce the main draft/output.\n3. Review against accuracy, format and constraint requirements.\n4. Return the final output in the requested format.\n\nFor each stage, specify its input, task, output and quality checks. Keep each stage reusable and clearly separated.`}function copyResult(){navigator.clipboard?.writeText(document.getElementById('out').value)}</script><script src="../../ai/client.js"></script><script src="../../ai/tool-ai.js"></script></body></html>
