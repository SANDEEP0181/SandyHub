<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Build detailed AI image-generation prompts from subject, style, lighting, composition and mood."><link rel="canonical" href="https://sandeep0181.github.io/SandyHub/tools/ai-image-prompt/"><meta property="og:title" content="AI Image Prompt Builder — SandyHub"><meta property="og:description" content="Create structured image prompts locally without an API key."><meta name="twitter:card" content="summary"><title>AI Image Prompt Builder — SandyHub</title><link rel="stylesheet" href="../tool.css"></head><body><main class="tool-page"><a href="../../">← SandyHub</a><h1>AI Image Prompt Builder</h1><p>Build detailed prompts for image-generation models without sending data anywhere.</p><label>Subject<input id="subject" placeholder="e.g. Futuristic city"></label><label>Style<input id="style" placeholder="e.g. cinematic 3D illustration"></label><label>Lighting<input id="light" placeholder="e.g. golden hour"></label><label>Composition<input id="comp" placeholder="e.g. wide establishing shot"></label><label>Mood<input id="mood" placeholder="e.g. inspiring"></label><button onclick="make()">Generate Prompt</button><button onclick="copyResult()">Copy Result</button><textarea id="out" rows="12" readonly></textarea></main><script>function make(){const g=id=>document.getElementById(id).value.trim();document.getElementById('out').value=`Create an image of ${g('subject')||'[subject]'}. Style: ${g('style')||'[style]'}. Lighting: ${g('light')||'[lighting]'}. Composition: ${g('comp')||'[composition]'}. Mood: ${g('mood')||'[mood]'}. Add coherent details, strong visual hierarchy, realistic materials where appropriate, clean composition and high visual quality. Avoid text artifacts and unrelated objects.`}function copyResult(){navigator.clipboard?.writeText(document.getElementById('out').value)}</script></body></html>
