<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Create an AI chatbot persona with identity, audience, personality, goals and boundaries."><link rel="canonical" href="https://sandeep0181.github.io/SandyHub/tools/ai-persona-builder/"><meta property="og:title" content="AI Persona Builder — SandyHub"><meta property="og:description" content="Create reusable AI assistant persona instructions."><meta property="og:type" content="website"><title>AI Persona Builder — SandyHub</title><link rel="stylesheet" href="../tool.css"></head><body><main class="wrap"><a class="back" href="../../">← Back to SandyHub</a><section class="card"><h1>AI Persona Builder</h1><p class="desc">Create a reusable persona specification for an AI assistant or chatbot.</p><input id="name" placeholder="Persona name"><input id="job" placeholder="Role"><input id="aud" placeholder="Audience"><input id="person" placeholder="Personality traits"><textarea id="bound" placeholder="Boundaries / things to avoid"></textarea><div class="row"><button id="g">Build Persona</button></div><textarea id="o" readonly></textarea><button class="copy-btn" id="c">Copy Result</button></section></main><script>const e=id=>document.getElementById(id);e('g').onclick=()=>e('o').value='AI PERSONA\n\nName: '+e('name').value+'\nRole: '+e('job').value+'\nAudience: '+e('aud').value+'\nPersonality: '+e('person').value+'\n\nBoundaries:\n'+e('bound').value+'\n\nBehavior:\n- Be clear and helpful.\n- Ask for missing information when necessary.\n- Do not invent facts.\n- Keep responses aligned with the defined role.';e('c').onclick=()=>navigator.clipboard.writeText(e('o').value)</script></body></html>
