<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Minify HTML code online in your browser by removing unnecessary whitespace and comments."><link rel="canonical" href="https://sandeep0181.github.io/SandyHub/tools/html-minifier/"><meta property="og:title" content="HTML Minifier — SandyHub"><meta property="og:description" content="Minify HTML code locally in your browser."><meta property="og:type" content="website"><meta name="twitter:card" content="summary"><title>HTML Minifier — SandyHub</title><link rel="stylesheet" href="../tool.css"></head><body><main class="wrap"><a class="back" href="../../">← Back to SandyHub</a><section class="card"><h1>HTML Minifier</h1><p class="desc">Reduce unnecessary HTML whitespace and comments locally in your browser.</p><textarea id="input" placeholder="Paste HTML here..."></textarea><div class="row"><button id="run">Minify HTML</button><button class="secondary" id="clear">Clear</button></div><textarea id="output" placeholder="Minified HTML..." readonly></textarea><button class="copy-btn" id="copy">Copy Result</button><p class="note">Your HTML stays in your browser.</p></section></main><script>const i=document.getElementById('input'),o=document.getElementById('output');document.getElementById('run').onclick=()=>{o.value=i.value.replace(/<!--[\s\S]*?-->/g,'').replace(/>\s+</g,'><').replace(/[\t\r\n]+/g,' ').replace(/\s{2,}/g,' ').trim()};document.getElementById('clear').onclick=()=>{i.value=o.value=''};document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(o.value)</script></body></html>
