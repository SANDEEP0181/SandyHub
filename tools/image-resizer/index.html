<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Resize images in your browser with custom width and height, then download the result."><link rel="canonical" href="https://sandeep0181.github.io/SandyHub/tools/image-resizer/"><meta property="og:title" content="Image Resizer — SandyHub"><meta property="og:description" content="Resize images locally in your browser."><meta property="og:type" content="website"><meta name="twitter:card" content="summary"><title>Image Resizer — SandyHub</title><link rel="stylesheet" href="../tool.css"></head><body><main class="wrap"><a class="back" href="../../">← Back to SandyHub</a><section class="card"><h1>Image Resizer</h1><p class="desc">Resize an image locally and download the result.</p><input id="file" type="file" accept="image/*"><div class="row"><input id="w" type="number" placeholder="Width"><input id="h" type="number" placeholder="Height"></div><label><input id="keep" type="checkbox" checked> Keep aspect ratio</label><div class="row"><button id="go">Resize & Download</button></div><p id="status" class="note"></p><canvas id="cv" style="max-width:100%;display:none"></canvas></section></main><script>let img=new Image(),f=document.getElementById('file'),w=document.getElementById('w'),h=document.getElementById('h');f.onchange=()=>{let x=f.files[0];if(!x)return;img.onload=()=>{w.value=img.naturalWidth;h.value=img.naturalHeight};img.src=URL.createObjectURL(x)};w.oninput=()=>{if(document.getElementById('keep').checked&&img.naturalWidth)h.value=Math.round(w.value*img.naturalHeight/img.naturalWidth)};h.oninput=()=>{if(document.getElementById('keep').checked&&img.naturalHeight)w.value=Math.round(h.value*img.naturalWidth/img.naturalHeight)};document.getElementById('go').onclick=()=>{if(!img.src)return;let c=document.getElementById('cv'),ww=Math.max(1,+w.value),hh=Math.max(1,+h.value);c.width=ww;c.height=hh;c.getContext('2d').drawImage(img,0,0,ww,hh);c.toBlob(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sandyhub-resized.png';a.click();document.getElementById('status').textContent='Image resized and downloaded.'},'image/png')}</script></body></html>
