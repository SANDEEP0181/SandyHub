<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Build an AI-ready prompt to explain code, identify risks and suggest improvements."><link rel="canonical" href="https://sandeep0181.github.io/SandyHub/tools/ai-code-explainer/"><meta property="og:title" content="AI Code Explainer — SandyHub"><meta property="og:description" content="Create structured prompts for code explanation and review."><meta name="twitter:card" content="summary"><title>AI Code Explainer — SandyHub</title><link rel="stylesheet" href="../tool.css"></head><body><main class="tool-page"><a href="../../">← SandyHub</a><h1>AI Code Explainer</h1><p>Prepare a structured prompt for an AI coding assistant.</p><label>Language<input id="lang" placeholder="e.g. JavaScript"></label><label>What do you need?<input id="need" placeholder="e.g. Explain this code for a beginner"></label><label>Code<textarea id="code" rows="10" placeholder="Paste code here..."></textarea></label><button onclick="make()">Generate Prompt</button><button onclick="copyResult()">Copy Result</button><textarea id="out" rows="14" readonly></textarea></main><script>function make(){const g=id=>document.getElementById(id).value.trim();document.getElementById('out').value=`Act as a senior ${g('lang')||'[language]'} developer and teacher.\n\nRequest: ${g('need')||'Explain the code clearly'}\n\nCode:\n${g('code')||'[paste code]'}\n\nProvide: a concise overview, step-by-step explanation, important dependencies, potential bugs or security concerns, and practical improvement suggestions. Do not claim to have executed the code unless execution evidence is provided.`}function copyResult(){navigator.clipboard?.writeText(document.getElementById('out').value)}</script></body></html>
